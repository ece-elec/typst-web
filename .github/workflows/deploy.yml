name: Deploy Typst Web (Haita) to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: "latest"

      - name: Compile Haita Web Book & PDF
        run: |
          mkdir -p dist
          # 1. Compiler le site web multi-pages (HTML bundle)
          typst compile --features bundle,html --format bundle main.typ dist

          # 2. Compiler l'équivalent PDF du cours complet
          typst compile --features bundle,html --format pdf main.typ dist/cours-complet.pdf

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
